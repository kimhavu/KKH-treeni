/* ===========================================================================
   Vire — Webfonts
   Geometric sans: Plus Jakarta Sans (UI + display)
   Mono: JetBrains Mono (occasional data / code)

   NOTE: Loaded from Google Fonts CDN. To fully self-host, drop the .woff2
   files into /fonts and replace these @import lines with @font-face rules.
   Plus Jakarta Sans is an exact match (not a substitution).
   =========================================================================== */

@import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap");

/* ===========================================================================
   Vire — Color tokens (KKH-brändi, mäkihyppy)
   Navy + jäänsininen pohja (Hiihtoliiton/KKH-materiaalin mukaan),
   energiset korostukset herokuvasta: pinkki liivi (liike) ja keltainen
   kypärä (ravinto/energia). Token-nimet säilytetty yhteensopivuuden vuoksi.
   =========================================================================== */

:root {
  /* --- Brand: jäänsininen ------------------------------------------------- */
  --brand-50:  #EAF6FC;
  --brand-100: #D2ECF8;
  --brand-200: #A8DAF1;
  --brand-300: #74C4E8;
  --brand-400: #45ACDB;
  --brand-500: #1E8FCB; /* päävärikorostus (valkoinen teksti luettava) */
  --brand-600: #1873A6;
  --brand-700: #145C85;
  --brand-800: #0F4565;
  --brand-900: #0A2F45;

  /* --- Ink / neutral (navy-sävyinen) --------------------------------------- */
  --ink-900: #0B1B26;
  --ink-800: #1A2A36;
  --ink-700: #33434F;
  --ink-600: #4F5E6A;
  --ink-500: #7A8893;
  --ink-400: #A3AFB8;
  --ink-300: #C7D0D7;
  --ink-200: #E1E7EC;
  --ink-100: #EDF2F5;
  --ink-50:  #F6F9FB;
  --white:   #FFFFFF;

  /* --- Korostukset --------------------------------------------------------- */
  /* liike / askeleet — pinkki (liivi) */
  --sage-100: #FCE3EF;
  --sage-300: #F2A4C8;
  --sage-500: #D9418C;
  --sage-700: #A42A67;

  /* ravinto / energia — kypäränkeltainen */
  --apricot-100: #FDF3D3;
  --apricot-300: #F7D774;
  --apricot-500: #E9B521;
  --apricot-700: #8A6806;

  /* lepo */
  --lilac-100: #E8EBFA;
  --lilac-500: #7C8BE0;

  /* --- Status -------------------------------------------------------------- */
  --green-100: #E3F3EA;
  --green-500: #3FA36B;
  --green-700: #2A7449;
  --amber-100: #FBEFD6;
  --amber-500: #E0A95E;
  --amber-700: #B47F34;
  --coral-100: #FBE3DE;
  --coral-500: #D9573F;
  --coral-700: #A93C28;

  /* --- Semantic aliases ---------------------------------------------------- */
  --text-primary:   var(--ink-900);
  --text-secondary: var(--ink-600);
  --text-muted:     var(--ink-500);
  --text-disabled:  var(--ink-400);
  --text-inverse:   var(--white);
  --text-brand:     var(--brand-600);
  --text-link:      var(--brand-600);

  --surface-page:   #F2F6F9;
  --surface-card:   #FFFFFF;
  --surface-sunken: #EAF0F4;
  --surface-raised: #FFFFFF;
  --surface-brand:  var(--brand-500);
  --surface-brand-soft: var(--brand-50);
  --surface-inverse: var(--ink-900);
  --surface-overlay: rgba(8, 21, 31, 0.5);

  --border-subtle:  var(--ink-200);
  --border-default: var(--ink-300);
  --border-strong:  var(--ink-400);
  --border-brand:   var(--brand-500);
  --border-focus:   var(--brand-500);

  --action-brand:        var(--brand-500);
  --action-brand-hover:  var(--brand-600);
  --action-brand-active: var(--brand-700);

  /* Päänapit — jäänsininen, navy-teksti */
  --btn-primary-bg:        #6EC6EA;
  --btn-primary-bg-hover:  #52B8E3;
  --btn-primary-bg-active: #3AA8D6;
  --btn-primary-ink:       #08151F;
  --btn-primary-shadow:    0 6px 18px rgba(30, 143, 203, 0.32);

  --accent-movement:  var(--sage-500);
  --accent-nutrition: var(--apricot-500);
  --accent-rest:      var(--lilac-500);

  --status-success:    var(--green-500);
  --status-success-bg: var(--green-100);
  --status-warning:    var(--amber-500);
  --status-warning-bg: var(--amber-100);
  --status-error:      var(--coral-500);
  --status-error-bg:   var(--coral-100);
  --status-info:       var(--brand-500);
  --status-info-bg:    var(--brand-50);

  --nav-bg: rgba(255, 255, 255, 0.40);
  --home-base: #08151F; /* etusivun pohja: KKH-navy */
  --ring-focus: 0 0 0 3px rgba(30, 143, 203, 0.34);
}

  --brand-50:  #102536;

  --coral-100: #3A1C16;

  --ink-100: #13222E;
  --ink-200: #1D2E3B;

  --brand-600: #8ED2F0;
  --brand-700: #B3E1F5;
  --sage-700:  #F2A4C8;
  --apricot-700: #F7D774;
  --green-700: #8FD3AC;
  --amber-700: #E6C58C;
  --coral-700: #F0A291;
  --ink-700:   #C9D3DA;
  --ink-600:   #A6B3BC;

  --text-primary:   #EEF4F8;
  --text-secondary: #A6B3BC;
  --text-muted:     #7E8D98;
  --text-disabled:  #56646F;
  --text-brand:     #8ED2F0;
  --text-link:      #8ED2F0;

  --surface-page:   #07121A;
  --surface-card:   #0F1E29;
  --surface-sunken: #0B1821;
  --surface-raised: #142633;
  --surface-brand-soft: #102536;
  --surface-inverse: #EEF4F8;
  --surface-overlay: rgba(2, 6, 10, 0.66);

  --border-subtle:  #1A2B37;
  --border-default: #263947;
  --border-strong:  #364B5A;

  --nav-bg: rgba(8, 21, 31, 0.42);
  --home-base: #050E15;

  --status-success-bg: var(--green-100);
  --status-warning-bg: var(--amber-100);
  --status-error-bg:   var(--coral-100);
  --status-info-bg:    var(--brand-50);
  --ring-focus: 0 0 0 3px rgba(110, 198, 234, 0.4);
  color-scheme: dark;

/* ===========================================================================
   Vire — Typography tokens
   Geometric sans (Plus Jakarta Sans) across the system. Numbers use the same
   family with tabular figures for stats/streaks.
   =========================================================================== */

:root {
  /* --- Families ------------------------------------------------------------ */
  --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system,
    "Segoe UI", Roboto, sans-serif;
  --font-display: var(--font-sans);
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* --- Weights ------------------------------------------------------------- */
  --weight-regular:  400;
  --weight-medium:   500;
  --weight-semibold: 600;
  --weight-bold:     700;
  --weight-extra:    800;

  /* --- Type scale (1.250 major-third-ish, tuned) --------------------------- */
  --text-2xs:  0.6875rem;  /* 11px — micro labels */
  --text-xs:   0.75rem;    /* 12px */
  --text-sm:   0.875rem;   /* 14px */
  --text-base: 1rem;       /* 16px — body */
  --text-md:   1.125rem;   /* 18px */
  --text-lg:   1.375rem;   /* 22px */
  --text-xl:   1.75rem;    /* 28px */
  --text-2xl:  2.25rem;    /* 36px */
  --text-3xl:  2.875rem;   /* 46px */
  --text-4xl:  3.75rem;    /* 60px — display */

  /* --- Line heights -------------------------------------------------------- */
  --leading-tight:   1.12;
  --leading-snug:    1.28;
  --leading-normal:  1.5;
  --leading-relaxed: 1.7;

  /* --- Letter spacing ------------------------------------------------------ */
  --tracking-tight:  -0.02em;  /* large display */
  --tracking-snug:   -0.01em;  /* headings */
  --tracking-normal: 0;
  --tracking-wide:   0.04em;   /* eyebrows / overline */
  --tracking-caps:   0.08em;   /* all-caps labels */

  /* --- Semantic roles ------------------------------------------------------ */
  --display-size:   var(--text-4xl);
  --display-weight: var(--weight-bold);
  --display-leading: var(--leading-tight);
  --display-tracking: var(--tracking-tight);

  --h1-size: var(--text-3xl);
  --h2-size: var(--text-2xl);
  --h3-size: var(--text-xl);
  --h4-size: var(--text-lg);

  --body-size:   var(--text-base);
  --body-leading: var(--leading-normal);
  --body-small:  var(--text-sm);

  --label-size:   var(--text-sm);
  --label-weight: var(--weight-semibold);

  --eyebrow-size:   var(--text-xs);
  --eyebrow-weight: var(--weight-semibold);
  --eyebrow-tracking: var(--tracking-caps);
}

/* ===========================================================================
   Vire — Spacing, radii, shadows, borders, layout
   Calm minimal: generous rounding, very soft cool-tinted shadows.
   4px base spacing scale.
   =========================================================================== */

:root {
  /* --- Spacing scale (4px base) -------------------------------------------- */
  --space-0:  0;
  --space-1:  0.25rem;  /* 4 */
  --space-2:  0.5rem;   /* 8 */
  --space-3:  0.75rem;  /* 12 */
  --space-4:  1rem;     /* 16 */
  --space-5:  1.25rem;  /* 20 */
  --space-6:  1.5rem;   /* 24 */
  --space-8:  2rem;     /* 32 */
  --space-10: 2.5rem;   /* 40 */
  --space-12: 3rem;     /* 48 */
  --space-16: 4rem;     /* 64 */
  --space-20: 5rem;     /* 80 */
  --space-24: 6rem;     /* 96 */

  /* --- Radii (generous, soft) ---------------------------------------------- */
  --radius-xs:   6px;
  --radius-sm:   10px;
  --radius-md:   14px;   /* default control */
  --radius-lg:   20px;   /* cards */
  --radius-xl:   28px;   /* large surfaces / sheets */
  --radius-2xl:  36px;
  --radius-pill: 999px;
  --radius-round: 50%;

  /* --- Border widths ------------------------------------------------------- */
  --border-thin:   1px;
  --border-medium: 1.5px;
  --border-thick:  2px;

  /* --- Shadows — soft, cool-tinted, low opacity ---------------------------- */
  --shadow-xs: 0 1px 2px rgba(39, 43, 61, 0.05);
  --shadow-sm: 0 1px 3px rgba(39, 43, 61, 0.06), 0 1px 2px rgba(39, 43, 61, 0.04);
  --shadow-md: 0 4px 12px rgba(39, 43, 61, 0.07), 0 2px 4px rgba(39, 43, 61, 0.04);
  --shadow-lg: 0 12px 28px rgba(39, 43, 61, 0.10), 0 4px 8px rgba(39, 43, 61, 0.04);
  --shadow-xl: 0 24px 56px rgba(39, 43, 61, 0.14), 0 8px 16px rgba(39, 43, 61, 0.06);
  --shadow-brand: 0 8px 24px rgba(142, 114, 118, 0.30);

  /* --- Layout -------------------------------------------------------------- */
  --container-max: 1200px;
  --sidebar-width: 252px;
  --content-gutter: var(--space-6);
  --app-mobile-width: 390px; /* iPhone canvas */

  /* --- Motion -------------------------------------------------------------- */
  --duration-fast:   140ms; /* @kind other */
  --duration-base:   240ms; /* @kind other */
  --duration-slow:   400ms; /* @kind other */
  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */
  --ease-gentle:   cubic-bezier(0.32, 0.72, 0, 1); /* @kind other */ /* calm settle, no bounce */
  --ease-out:      cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */
}

/* ===========================================================================
   Vire — Base / reset
   Minimal, opinionated base layer that applies the brand defaults.
   Consumers get sensible typography + surface defaults for free.
   =========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: var(--body-size);
  line-height: var(--body-leading);
  font-weight: var(--weight-regular);
  color: var(--text-primary);
  background: var(--surface-page);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "cv11", "ss01";
}

h1, h2, h3, h4, h5, h6 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: var(--weight-bold);
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-snug);
  color: var(--text-primary);
  text-wrap: balance;
}

p {
  margin: 0;
  text-wrap: pretty;
}

a {
  color: var(--text-link);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}

button {
  font-family: inherit;
}

/* Tabular figures helper for stats / streaks / counters */
.vire-tnum {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

::selection {
  background: var(--brand-200);
  color: var(--ink-900);
}

  /* splash */
  #splash {
    position: fixed; top: 0; left: 0; right: 0;
    bottom: calc(-1 * (env(safe-area-inset-bottom, 0px) + 28px));
    min-height: 100dvh;
    z-index: 9999; display: grid; place-items: center;
    background: linear-gradient(168deg, #08151F 0%, #0F3550 55%, #1E8FCB 120%);
    transition: opacity .5s ease; cursor: pointer;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash .wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; animation: splashIn .8s cubic-bezier(0.16,1,0.3,1) both; }
  #splash img, #splash svg { width: 92px; height: 92px; animation: splashLogo 2.4s ease-in-out infinite; }
  #splash .name { font-size: 40px; font-weight: 800; color: #fff; letter-spacing: -0.03em; }
  #splash .tag { font-size: 16px; color: rgba(255,255,255,0.85); font-weight: 600; }
  #splash .bar { width: 120px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.28); overflow: hidden; margin-top: 6px; }
  #splash .bar span { display: block; height: 100%; background: #fff; border-radius: 999px; animation: splashBar 5s linear forwards; }
  @keyframes splashIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes splashLogo { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes splashBar { from { width: 0; } to { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { #splash img, #splash svg { animation: none; } }
</style>

  };

  const keys = Object.keys(store.state.days).sort();
  keys.forEach(k => {

    (d.meals || []).forEach(m => rows.push([k, "Ateria", m.text || "", m.kcal || "", "", "", ""]));

function nextSession(store, lang = "fi") {
  const today = new Date();
  const todayDow = (today.getDay() + 6) % 7;
  // jos tämän päivän sessio on jo treeni-päivä eikä lepo, näytä se; muuten seuraava treenipäivä
  for (let i = 0; i < 7; i++) {
    const dow = (todayDow + i) % 7;
    const p = DEFAULT_PLAN.find(x => x.dow === dow);
    if (!p) continue;
    const isRest = !p.icon || p.mins === 0;
    if (i === 0 && isRest) {
      // tänään lepo: tarjoa se sellaisenaan
      return {
        ...p,
        when: 0,
        isRest,
        name: p.name[lang] || p.name.fi,
        focus: p.focus[lang] || p.focus.fi
      };
    }
    if (isRest) continue;
    return {
      ...p,
      when: i,
      isRest: false,
      name: p.name[lang] || p.name.fi,
      focus: p.focus[lang] || p.focus.fi
    };
  }
  const p = DEFAULT_PLAN[0];
  return {
    ...p,
    when: 0,
    isRest: false,
    name: p.name[lang] || p.name.fi,
    focus: p.focus[lang] || p.focus.fi
  };
}

/* päivän johdetut summat */
function dayTotals(day) {
  const energy = day.meals.reduce((a, m) => a + (Number(m.kcal) || 0), 0);
  const activeMin = day.workouts.reduce((a, w) => a + (Number(w.mins) || 0), 0);
  return {
    energy,
    activeMin,
    steps: day.steps || 0,
    water: day.water || 0
  };
}

   Yrittää hakea ohjelmat annetusta osoitteesta. Palauttaa { ok, programs?, error? }.

async function fetchPrograms(url) {
  if (!url) return {
    ok: false,
    error: "no-url"
  };
  try {
    const res = await fetch(url, {
      cache: "no-store"
    });
    if (!res.ok) return {
      ok: false,
      error: "http-" + res.status
    };
    const text = await res.text();
    let programs;
    if (text.trim().startsWith("{") || text.trim().startsWith("[")) {
      const data = JSON.parse(text);
      programs = {
        workouts: data.workouts || data,
        nutrition: data.nutrition || null
      };
    } else {
      // CSV → riveiksi
      const rows = text.trim().split(/\r?\n/).map(r => r.split(","));
      const head = rows.shift() || [];
      const items = rows.map(r => Object.fromEntries(head.map((h, i) => [h.trim(), (r[i] || "").trim()])));
      programs = {
        workouts: items,
        nutrition: null
      };
    }
    return {
      ok: true,
      programs
    };
  } catch (e) {
    return {
      ok: false,
      error: String(e && e.message || e)
    };
  }
}

function makeT(lang) {
  const L = (lang === "en" || lang === "sv") ? lang : "fi";
  return function t(key, vars) {
    const entry = STR[key];
    let s = entry ? (entry[L] || entry.fi) : key;
    if (vars) for (const k in vars) s = s.replace(new RegExp("\\{" + k + "\\}", "g"), vars[k]);
    return s;
  };
}

/* viikonpäivät + kuukaudet kielikohtaisesti */
const DOW_SHORT = {
  fi: ["Ma","Ti","Ke","To","Pe","La","Su"],
  en: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
  sv: ["Mån","Tis","Ons","Tor","Fre","Lör","Sön"],
};
const DOW_LONG = {
  fi: ["sunnuntai","maanantai","tiistai","keskiviikko","torstai","perjantai","lauantai"],
  en: ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
  sv: ["söndag","måndag","tisdag","onsdag","torsdag","fredag","lördag"],
};
const MONTHS = {
  fi: ["tammikuuta","helmikuuta","maaliskuuta","huhtikuuta","toukokuuta","kesäkuuta","heinäkuuta","elokuuta","syyskuuta","lokakuuta","marraskuuta","joulukuuta"],
  en: ["January","February","March","April","May","June","July","August","September","October","November","December"],
  sv: ["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"],
};
const MONTHS_SHORT = {
  fi: ["tammi","helmi","maalis","huhti","touko","kesä","heinä","elo","syys","loka","marras","joulu"],
  en: ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
  sv: ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"],
};

function longDateL(lang, d = new Date()) {
  const L = DOW_LONG[lang] ? lang : "fi";
  const dow = DOW_LONG[L][d.getDay()];
  const cap = dow.charAt(0).toUpperCase() + dow.slice(1);
  if (L === "en") return `${cap}, ${MONTHS[L][d.getMonth()]} ${d.getDate()}`;
  if (L === "sv") return `${cap} ${d.getDate()} ${MONTHS[L][d.getMonth()]}`;
  return `${cap} ${d.getDate()}. ${MONTHS[L][d.getMonth()]}`;
}
function localeFor(lang) { return lang === "en" ? "en-GB" : lang === "sv" ? "sv-SE" : "fi-FI"; }
function numFmt(lang, n) { return Number(n).toLocaleString(localeFor(lang)); }

Object.assign(window, { STR, makeT, DOW_SHORT, DOW_LONG, MONTHS, MONTHS_SHORT, longDateL, localeFor, numFmt });

<script type="text/babel">
/* Vire-app — tilamalli + localStorage + päivä/viikko-apurit.
   Kaikki alkaa nollasta. v0.1.1: asetukset, kieli, teema, fiilis, pilvisynkkaus. */

const STORE_KEY = "vire.kkh.v1";
const APP_VERSION = "0.2.1";

/* ---------- päivä & viikko ---------- */
function dateKey(d = new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function parseKey(key) { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d); }
function isoWeek(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (t.getUTCDay() + 6) % 7;
  t.setUTCDate(t.getUTCDate() - dayNum + 3);
  const firstThu = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  const firstDayNum = (firstThu.getUTCDay() + 6) % 7;
  firstThu.setUTCDate(firstThu.getUTCDate() - firstDayNum + 3);
  return 1 + Math.round((t - firstThu) / (7 * 24 * 3600 * 1000));
}
function weekDays(ref = new Date()) {
  const dow = (ref.getDay() + 6) % 7;
  const monday = new Date(ref); monday.setDate(ref.getDate() - dow);
  return Array.from({ length: 7 }, (_, i) => { const d = new Date(monday); d.setDate(monday.getDate() + i); return d; });
}
function shortDate(d, lang) {
  if (lang === "en") return `${d.getMonth() + 1}/${d.getDate()}`;
  return `${d.getDate()}.${d.getMonth() + 1}.`;
}

/* ---------- oletustila (tyhjä) ---------- */
function freshState() {
  return {
    onboarded: false,
    licensed: false,
    licenseEmail: "",
    version: APP_VERSION,
    profile: { name: "", since: dateKey(), photo: "", email: "", age: "", height: "", weight: "" },
    goals: { steps: 8000, energy: 2000, activeMin: 30, water: 8 },
    settings: {
      lang: "fi",
      theme: "light",
      hideRings: false,
      notif: { workout: true, meal: true, weekly: true, mood: false },
      syncUrl: "",
    },
    programs: { workouts: null, nutrition: null, syncedAt: null },
    messages: [],
    days: {}, // 'YYYY-MM-DD' -> { steps, water, meals:[], workouts:[], mood }
  };
}
function freshDay() { return { steps: 0, water: 0, meals: [], workouts: [], mood: null }; }

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return freshState();
    const saved = JSON.parse(raw);
    const base = freshState();
    return {
      ...base, ...saved,
      profile: { ...base.profile, ...(saved.profile || {}) },
      goals: { ...base.goals, ...(saved.goals || {}) },
      messages: saved.messages || base.messages,
      settings: { ...base.settings, ...(saved.settings || {}), notif: { ...base.settings.notif, ...((saved.settings || {}).notif || {}) } },
      programs: { ...base.programs, ...(saved.programs || {}) },
      version: APP_VERSION,
    };
  } catch (e) { return freshState(); }
}
function saveState(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {} }

/* ---------- React-hook ---------- */
function useVireStore() {
  const [state, setState] = React.useState(loadState);
  React.useEffect(() => { saveState(state); }, [state]);

  /* teema + kieli dokumenttiin */
  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", state.settings.theme === "dark" ? "dark" : "light");
    document.documentElement.setAttribute("lang", state.settings.lang);
  }, [state.settings.theme, state.settings.lang]);

  const patchDayFn = (s, key, fn) => {
    const cur = s.days[key] || freshDay();
    return { ...s, days: { ...s.days, [key]: fn(cur) } };
  };

  const api = React.useMemo(() => ({
    state,
    version: APP_VERSION,
    completeOnboarding(profile, goals) {
      setState((s) => ({ ...s, onboarded: true, profile: { ...s.profile, ...profile, since: dateKey() }, goals: { ...s.goals, ...goals } }));
    },
    setLicensed(email) { setState((s) => ({ ...s, licensed: true, licenseEmail: email || s.licenseEmail, profile: { ...s.profile, email: email || s.profile.email } })); },
    clearPrograms() { setState((s) => ({ ...s, programs: { workouts: null, nutrition: null, syncedAt: null } })); },
    sendMessage(text) {
      const now = Date.now();
      setState((s) => ({ ...s, messages: [...(s.messages || []), { id: now, from: "me", text, t: now }, { id: now + 1, from: "coach", text: "__auto__", t: now + 1 }] }));
    },
    updateProfile(patch) { setState((s) => ({ ...s, profile: { ...s.profile, ...patch } })); },
    updateGoals(patch) { setState((s) => ({ ...s, goals: { ...s.goals, ...patch } })); },
    updateSettings(patch) { setState((s) => ({ ...s, settings: { ...s.settings, ...patch } })); },
    updateNotif(patch) { setState((s) => ({ ...s, settings: { ...s.settings, notif: { ...s.settings.notif, ...patch } } })); },
    setPrograms(programs) { setState((s) => ({ ...s, programs: { ...programs, syncedAt: Date.now() } })); },
    day(key = dateKey()) { return state.days[key] || freshDay(); },
    addSteps(key, n) { setState((s) => patchDayFn(s, key, (c) => ({ ...c, steps: Math.max(0, c.steps + n) }))); },
    setSteps(key, n) { setState((s) => patchDayFn(s, key, (c) => ({ ...c, steps: Math.max(0, n) }))); },
    setWater(key, n) { setState((s) => patchDayFn(s, key, (c) => ({ ...c, water: Math.max(0, n) }))); },
    setMood(key, mood) { setState((s) => patchDayFn(s, key, (c) => ({ ...c, mood }))); },
    addMeal(key, meal) { setState((s) => patchDayFn(s, key, (c) => ({ ...c, meals: [...c.meals, { id: Date.now() + Math.random(), ...meal }] }))); },
    removeMeal(key, id) { setState((s) => patchDayFn(s, key, (c) => ({ ...c, meals: c.meals.filter((m) => m.id !== id) }))); },
    addWorkout(key, w) { setState((s) => patchDayFn(s, key, (c) => ({ ...c, workouts: [...c.workouts, { id: Date.now() + Math.random(), ...w }] }))); },
    removeWorkout(key, id) { setState((s) => patchDayFn(s, key, (c) => ({ ...c, workouts: c.workouts.filter((w) => w.id !== id) }))); },
    resetAll() { const fresh = freshState(); saveState(fresh); setState(fresh); },
  }), [state]);

  return api;
}

/* Seuraava suunniteltu sessio etusivun agendaa varten.
   Käyttää synkronoitua ohjelmaa jos saatavilla, muuten oletusohjelmaa. */
function nextSession(store, lang = "fi") {
  const today = new Date();
  const todayDow = (today.getDay() + 6) % 7;
  // jos tämän päivän sessio on jo treeni-päivä eikä lepo, näytä se; muuten seuraava treenipäivä
  for (let i = 0; i < 7; i++) {
    const dow = (todayDow + i) % 7;
    const p = DEFAULT_PLAN.find((x) => x.dow === dow);
    if (!p) continue;
    const isRest = !p.icon || p.mins === 0;
    if (i === 0 && isRest) {
      // tänään lepo: tarjoa se sellaisenaan
      return { ...p, when: 0, isRest, name: p.name[lang] || p.name.fi, focus: p.focus[lang] || p.focus.fi };
    }
    if (isRest) continue;
    return { ...p, when: i, isRest: false, name: p.name[lang] || p.name.fi, focus: p.focus[lang] || p.focus.fi };
  }
  const p = DEFAULT_PLAN[0];
  return { ...p, when: 0, isRest: false, name: p.name[lang] || p.name.fi, focus: p.focus[lang] || p.focus.fi };
}

/* päivän johdetut summat */
function dayTotals(day) {
  const energy = day.meals.reduce((a, m) => a + (Number(m.kcal) || 0), 0);
  const activeMin = day.workouts.reduce((a, w) => a + (Number(w.mins) || 0), 0);
  return { energy, activeMin, steps: day.steps || 0, water: day.water || 0 };
}

/* ---------- pilvisynkronointi (CSV tai JSON URL) ----------
   Yrittää hakea ohjelmat annetusta osoitteesta. Palauttaa { ok, programs?, error? }.
   Tukee: JSON ({workouts, nutrition}) tai yksinkertainen CSV (otsikkorivi + rivit). */
async function fetchPrograms(url) {
  if (!url) return { ok: false, error: "no-url" };
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) return { ok: false, error: "http-" + res.status };
    const text = await res.text();
    let programs;
    if (text.trim().startsWith("{") || text.trim().startsWith("[")) {
      const data = JSON.parse(text);
      programs = { workouts: data.workouts || data, nutrition: data.nutrition || null };
    } else {
      // CSV → riveiksi
      const rows = text.trim().split(/\r?\n/).map((r) => r.split(","));
      const head = rows.shift() || [];
      const items = rows.map((r) => Object.fromEntries(head.map((h, i) => [h.trim(), (r[i] || "").trim()])));
      programs = { workouts: items, nutrition: null };
    }
    return { ok: true, programs };
  } catch (e) {
    return { ok: false, error: String(e && e.message || e) };
  }
}

/* Puolikaari-mittari (tavoite-edistyminen). value 0..1 */
function GaugeSemi({ value, size = 200, stroke = 16, track = "rgba(255,255,255,0.22)", fill = "#fff", children }) {
  const v = Math.max(0, Math.min(1, value || 0));
  const r = (size - stroke) / 2;
  const cx = size / 2, cy = size / 2;
  const len = Math.PI * r;
  const d = `M ${stroke / 2} ${cy} A ${r} ${r} 0 0 1 ${size - stroke / 2} ${cy}`;
  return (
    <div style={{ position: "relative", width: size, height: size / 2 + stroke / 2 + 6 }}>
      <svg width={size} height={size / 2 + stroke} style={{ display: "block", overflow: "visible" }}>
        <path d={d} fill="none" stroke={track} strokeWidth={stroke} strokeLinecap="round" />
        <path d={d} fill="none" stroke={fill} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={len} strokeDashoffset={len * (1 - v)}
          style={{ transition: "stroke-dashoffset 1s var(--ease-out)" }} />
      </svg>
      <div style={{ position: "absolute", left: 0, right: 0, bottom: 4, display: "flex", flexDirection: "column", alignItems: "center" }}>
        {children}
      </div>
    </div>
  );
}

      {action}
    </Card>
  );
}

/* Kevyt dropdown-valikko (oma, ei natiivi). options = [{value,label,icon?}] */
function Dropdown({ value, options, onChange, placeholder, icon }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);
  const sel = options.find((o) => o.value === value);
  return (
    <div ref={ref} style={{ position: "relative" }}>
      <button onClick={() => setOpen((v) => !v)} style={{
        width: "100%", boxSizing: "border-box", display: "flex", alignItems: "center", gap: 10,
        padding: "12px 14px", borderRadius: "var(--radius-md)", border: "1px solid var(--border-default)",
        background: "var(--surface-card)", cursor: "pointer", fontFamily: "var(--font-sans)", textAlign: "left",
        color: sel ? "var(--text-primary)" : "var(--text-muted)", fontSize: 15,
      }}>
        {icon || (sel && sel.icon) ? <span style={{ color: "var(--brand-500)", display: "inline-flex" }}>{sel && sel.icon ? sel.icon : icon}</span> : null}
        <span style={{ flex: 1, fontWeight: sel ? 600 : 500 }}>{sel ? sel.label : (placeholder || "")}</span>
        <L name={open ? "chevron-up" : "chevron-down"} size={19} color="var(--ink-400)" />
      </button>
      {open ? (
        <div style={{
          position: "absolute", top: "calc(100% + 6px)", left: 0, right: 0, zIndex: 40,
          background: "var(--surface-card)", borderRadius: "var(--radius-md)", border: "1px solid var(--border-subtle)",
          boxShadow: "var(--shadow-lg)", overflow: "hidden", padding: 6,
        }}>
          {options.map((o) => (
            <button key={o.value} onClick={() => { onChange(o.value); setOpen(false); }} style={{
              width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "11px 12px", border: "none",
              background: o.value === value ? "var(--brand-50)" : "transparent", cursor: "pointer", borderRadius: "var(--radius-sm)",
              fontFamily: "var(--font-sans)", fontSize: 15, fontWeight: o.value === value ? 700 : 600,
              color: o.value === value ? "var(--brand-700)" : "var(--text-primary)", textAlign: "left",
            }}>
              {o.icon ? <span style={{ display: "inline-flex", color: o.value === value ? "var(--brand-600)" : "var(--ink-500)" }}>{o.icon}</span> : null}
              <span style={{ flex: 1 }}>{o.label}</span>
              {o.value === value ? <L name="check" size={17} color="var(--brand-600)" /> : null}
            </button>
          ))}
        </div>
      ) : null}
    </div>
  );
}

/* Section-otsikko listoille */
function SectionLabel({ children, style }) {
  return <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: ".07em", textTransform: "uppercase", color: "var(--text-muted)", margin: "0 4px 10px", ...style }}>{children}</div>;
}

<script type="text/babel">
/* Vire-app — Tänään (etusivu). Immersiivinen hero (taustakuva → teal),
   puolikaari-mittari, seuraavan treenin agenda, fiilis, ateriat & harjoitukset. */

const MOODS = [
  { value: "great", icon: "laugh", color: "var(--sage-500)", key: "mood_great" },
  { value: "good", icon: "smile", color: "var(--brand-500)", key: "mood_good" },
  { value: "even", icon: "meh", color: "var(--lilac-500)", key: "mood_even" },
  { value: "tired", icon: "frown", color: "var(--apricot-500)", key: "mood_tired" },
  { value: "stressed", icon: "annoyed", color: "var(--coral-500)", key: "mood_stressed" },
];

/* Mittarin alla näkyvä motivoiva teksti — vaihtuu päivän mittaan (kellonaika + edistyminen). */
function motivMessage(t, pct, now) {
  now = now || new Date();
  if (pct >= 100) return t("motiv_done");
  if (pct >= 78) return t("motiv_almost");
  const h = now.getHours();
  const pool = h < 6 ? ["motiv_night", "motiv_kind1"]
    : h < 10 ? ["motiv_dawn", "motiv_morning", "motiv_kind2"]
    : h < 14 ? ["motiv_midday", "motiv_kind2"]
    : h < 18 ? ["motiv_afternoon", "motiv_kind1"]
    : h < 22 ? ["motiv_evening", "motiv_kind1"]
    : ["motiv_night", "motiv_kind1"];
  const seed = now.getFullYear() * 366 + (now.getMonth() * 31 + now.getDate()) + h;
  return t(pool[seed % pool.length]);
}

/* Johdetut oivallukset käyttäjän omasta datasta. Palauttaa priorisoidun listan. */
function computeInsights(store, t, lang) {
  const out = [];
  const days = store.state.days || {};
  const keys = Object.keys(days);
  const hasDay = (d) => d && (d.meals.length || d.workouts.length || d.steps || d.water || d.mood);
  const loggedCount = keys.filter((k) => hasDay(days[k])).length;
  if (loggedCount < 2) return { ready: false, items: [] };

  // 1) putki (yhtäjaksoiset päivät tähän asti)
  let streak = 0;
  for (let i = 0; i < 120; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    if (hasDay(days[window.dateKey(d)])) streak++; else break;
  }
  if (streak >= 2) out.push({ icon: "flame", tint: "var(--apricot-500)", title: t("ins_streak", { n: streak }), body: t("ins_streak_s") });

  // 2) askeltrendi (3 tuoreinta vs 3 edellistä)
  const last6 = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); last6.push((days[window.dateKey(d)] || {}).steps || 0); }
  const recent = last6.slice(3).reduce((a, b) => a + b, 0);
  const prev = last6.slice(0, 3).reduce((a, b) => a + b, 0);
  if (prev > 0 && recent > 0) {
    const ch = Math.round(((recent - prev) / prev) * 100);
    if (ch >= 8) out.push({ icon: "trending-up", tint: "var(--sage-500)", title: t("ins_steptrend_up"), body: t("ins_steptrend_up_s", { n: ch }) });
    else if (ch <= -8) out.push({ icon: "trending-down", tint: "var(--brand-500)", title: t("ins_steptrend_dn"), body: t("ins_steptrend_dn_s") });
  }

  // 3) aktiivisin viikonpäivä (askeleet + liikeminuutit)
  const byDow = [0, 0, 0, 0, 0, 0, 0];
  keys.forEach((k) => { const d = days[k]; const dow = (window.parseKey(k).getDay() + 6) % 7; byDow[dow] += (d.steps || 0) + d.workouts.reduce((a, w) => a + (Number(w.mins) || 0) * 60, 0); });
  const maxDow = byDow.indexOf(Math.max(...byDow));
  if (byDow[maxDow] > 0) {
    const name = window.DOW_LONG[lang][(maxDow + 1) % 7];
    out.push({ icon: "calendar-heart", tint: "var(--lilac-500)", title: t("ins_bestday", { d: name.charAt(0).toUpperCase() + name.slice(1) }), body: t("ins_bestday_s") });
  }

  // 4) vesi tällä viikolla
  const goal = store.state.goals.water || 8;
  const wd = window.weekDays(new Date()).filter((d) => ((days[window.dateKey(d)] || {}).water || 0) >= goal).length;
  if (wd >= 1) out.push({ icon: "droplet", tint: "var(--brand-400)", title: t("ins_water"), body: t("ins_water_s", { n: wd }) });

  // 5) keskimääräinen energia (tuoreet kirjatut päivät)
  const en = keys.map((k) => days[k].meals.reduce((a, m) => a + (Number(m.kcal) || 0), 0)).filter((x) => x > 0);
  if (en.length >= 2) { const avg = Math.round(en.reduce((a, b) => a + b, 0) / en.length); out.push({ icon: "flame", tint: "var(--apricot-500)", title: t("ins_energy", { n: window.numFmt(lang, avg) }), body: t("ins_energy_s") }); }

  return { ready: out.length > 0, items: out.slice(0, 3) };
}

function InsightsCard({ store, t, lang }) {
  const { Card } = window.VS;
  const { L, SectionLabel } = window;
  const res = computeInsights(store, t, lang);
  return (
    <div>
      <SectionLabel>{t("insights_t")}</SectionLabel>
      {!res.ready ? (
        <Card padding="md" style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 38, height: 38, borderRadius: 11, background: "var(--brand-50)", color: "var(--brand-600)", display: "grid", placeItems: "center", flexShrink: 0 }}><L name="sparkles" size={19} /></div>
          <div style={{ fontSize: 13.5, color: "var(--text-secondary)", lineHeight: 1.45 }}>{t("ins_more")}</div>
        </Card>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {res.items.map((it, i) => (
            <Card key={i} flat style={{ display: "flex", alignItems: "center", gap: 13, padding: "13px 14px" }}>
              <div style={{ width: 40, height: 40, borderRadius: 12, background: "var(--ink-50)", color: it.tint, display: "grid", placeItems: "center", flexShrink: 0 }}><L name={it.icon} size={20} /></div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 700, fontSize: 14.5 }}>{it.title}</div>
                <div style={{ fontSize: 12.5, color: "var(--text-muted)", lineHeight: 1.4 }}>{it.body}</div>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

function Empty({ icon, label, onAdd, t }) {

  return (
    <button onClick={onAdd} style={{

      <L name="plus-circle" size={22} color="var(--brand-500)" />

}

function MoodField({ store, dayKey, t, lang }) {
  const { Card } = window.VS;
  const { L, Dropdown } = window;
  const day = store.day(dayKey);
  const opts = MOODS.map((m) => ({ value: m.value, label: t(m.key), icon: <L name={m.icon} size={18} /> }));

  const recent = window.weekDays(window.parseKey(dayKey)).map((d) => {
    const dd = store.day(window.dateKey(d));
    return { d, mood: dd.mood };
  });

  return (
    <Card padding="md">
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
        <div style={{ width: 38, height: 38, borderRadius: 12, background: "var(--lilac-100)", color: "var(--lilac-500)", display: "grid", placeItems: "center" }}>
          <L name="heart" size={20} />
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 700, fontSize: 15 }}>{t("mood_title")}</div>
          <div style={{ fontSize: 12.5, color: "var(--text-muted)" }}>{t("mood_sub")}</div>
        </div>
      </div>
      <Dropdown value={day.mood} options={opts} placeholder={t("mood_pick")} icon={<L name="smile" size={18} />} onChange={(v) => store.setMood(dayKey, v)} />
      <div style={{ marginTop: 14 }}>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: ".06em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 8 }}>{t("mood_history")}</div>
        <div style={{ display: "flex", gap: 6 }}>
          {recent.map((r, i) => {
            const m = MOODS.find((x) => x.value === r.mood);
            const isToday = window.dateKey(r.d) === dayKey;
            return (
              <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 5 }}>
                <div style={{
                  width: "100%", aspectRatio: "1", maxWidth: 38, borderRadius: 11, display: "grid", placeItems: "center",
                  background: m ? "color-mix(in srgb, " + m.color + " 16%, transparent)" : "var(--surface-sunken)",
                  border: isToday ? "1.5px solid var(--brand-300)" : "1.5px solid transparent",
                }}>
                  {m ? <L name={m.icon} size={18} color={m.color} /> : <span style={{ width: 5, height: 5, borderRadius: 99, background: "var(--ink-300)" }}></span>}
                </div>
                <span style={{ fontSize: 10, color: "var(--text-muted)", fontWeight: 600 }}>{window.DOW_SHORT[lang][i]}</span>
              </div>
            );
          })}
        </div>
      </div>
    </Card>
  );
}

const inputStyle = {
  flex: 1, height: 40, borderRadius: "var(--radius-md)", border: "1px solid var(--border-default)",
  padding: "0 14px", fontFamily: "var(--font-sans)", fontSize: 15, color: "var(--text-primary)", background: "var(--surface-card)",
};
const linkBtnLight = { border: "none", background: "rgba(255,255,255,0.16)", color: "#fff", fontWeight: 700, fontSize: 12.5, cursor: "pointer", fontFamily: "var(--font-sans)", padding: "5px 12px", borderRadius: 999 };
const miniChip = (bg, fg) => ({ width: 34, height: 34, borderRadius: 10, background: bg, color: fg, display: "grid", placeItems: "center", flexShrink: 0 });

Object.assign(window, { TodayScreen, MOODS });

<script type="text/babel">
/* Vire-app — Liike-moduuli. Alanavigaatio: Koti / Harjoitteet / Viikko-ohjelma. */

/* Esimerkkiharjoitteet (ei dataa — paikkamerkki personoidulle ohjelmalle). */
const SAMPLE_EXERCISES = [
  { name: { fi: "Kyykky", en: "Squat", sv: "Knäböj" }, sets: "4 × 10", tone: "duotone", dur: "0:46" },
  { name: { fi: "Punnerrus", en: "Push-up", sv: "Armhävning" }, sets: "3 × 12", tone: "sage", dur: "0:38" },
  { name: { fi: "Lankku", en: "Plank", sv: "Planka" }, sets: "3 × 45 s", tone: "warm", dur: "0:33" },
];

function VideoField({ tone = "duotone", duration = "0:45", caption }) {
  const { L } = window;
  const grads = {
    natural: "linear-gradient(135deg, #6E8C7C 0%, #9FB6A8 100%)",
    duotone: "linear-gradient(140deg, #3C4A93 0%, #6B7FD7 100%)",
    warm: "linear-gradient(135deg, #B5704A 0%, #E8A87C 100%)",

  };
  const [playing, setPlaying] = React.useState(false);
  return (
    <div onClick={() => setPlaying(true)} style={{ position: "relative", width: "100%", aspectRatio: "16 / 9", borderRadius: 14, overflow: "hidden", background: grads[tone], cursor: "pointer" }}>
      <div style={{ position: "absolute", inset: 0, opacity: 0.32, backgroundImage: "radial-gradient(rgba(255,255,255,0.18) 1px, transparent 1px)", backgroundSize: "4px 4px" }}></div>
      <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to top, rgba(0,0,0,0.3), rgba(0,0,0,0) 55%)" }}></div>
      <div style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center" }}>
        <div style={{ width: 56, height: 56, borderRadius: "50%", background: "rgba(255,255,255,0.92)", display: "grid", placeItems: "center", boxShadow: "0 6px 20px rgba(0,0,0,0.25)" }}>
          <L name={playing ? "loader" : "play"} size={23} color="var(--brand-600)" strokeWidth={2.4} />
        </div>
      </div>
      <div style={{ position: "absolute", left: 12, right: 12, bottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ fontSize: 12.5, fontWeight: 700, color: "#fff", display: "inline-flex", alignItems: "center", gap: 6 }}><L name="video" size={15} color="#fff" /> {caption}</span>
        <span style={{ fontSize: 12, fontWeight: 700, color: "#fff", background: "rgba(0,0,0,0.4)", padding: "3px 8px", borderRadius: 999, fontVariantNumeric: "tabular-nums" }}>{duration}</span>
      </div>
    </div>
  );
}

function LiikeModule({ store, onHome, t, lang, onMenu }) {
  const { AppFrame, BottomNav } = window;
  const [sub, setSub] = React.useState("harjoitteet");
  const [refDate, setRefDate] = React.useState(new Date());

  const items = [
    { id: "koti", label: t("nav_home"), icon: "house", onClick: onHome },
    { id: "harjoitteet", label: t("nav_workouts"), icon: "dumbbell", active: sub === "harjoitteet", onClick: () => setSub("harjoitteet") },
    { id: "viikko", label: t("nav_week"), icon: "calendar-days", active: sub === "viikko", onClick: () => setSub("viikko") },
  ];

  const screen = sub === "viikko"
    ? <ViikkoOhjelma store={store} refDate={refDate} setRefDate={setRefDate} t={t} lang={lang} onMenu={onMenu} onOpenDay={(d) => { setRefDate(d); setSub("harjoitteet"); }} />
    : <Harjoitteet store={store} refDate={refDate} t={t} lang={lang} onMenu={onMenu} />;

  return <AppFrame bottom={<BottomNav items={items} />}>{screen}</AppFrame>;
}

function Harjoitteet({ store, refDate, t, lang, onMenu }) {
  const { Card, Button, Badge, Input } = window.VS;
  const { L, PageHeader, EmptyState, SectionLabel } = window;
  const key = window.dateKey(refDate);
  const day = store.day(key);
  const isToday = key === window.dateKey();
  const [form, setForm] = React.useState(null);

  const save = () => {
    if (!form.name.trim()) return;
    store.addWorkout(key, { name: form.name.trim(), mins: Math.round(Number(form.mins) || 0), kcal: Math.round(Number(form.kcal) || 0) });
    setForm(null);
  };
  const totalMin = day.workouts.reduce((a, w) => a + (Number(w.mins) || 0), 0);
  const dateLabel = isToday ? t("nav_today") : `${window.DOW_SHORT[lang][(refDate.getDay() + 6) % 7]} ${window.shortDate(refDate, lang)}`;

  return (
    <div>
      <PageHeader title={t("move_title")} onMenu={onMenu} right={<Button variant="soft" size="sm" iconLeft={<L name="plus" size={16} />} onClick={() => setForm({ name: "", mins: "", kcal: "" })}>{t("log_btn")}</Button>} />
      <div style={{ padding: "0 20px", display: "flex", flexDirection: "column", gap: 16 }}>
        <div style={{ fontSize: 13, color: "var(--text-muted)", fontWeight: 600, margin: "-4px 4px 0" }}>{dateLabel} · {t("week_w")} {window.isoWeek(refDate)}</div>

        {day.workouts.length > 0 ? (
          <Card padding="md" style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div style={chip("var(--sage-100)", "var(--sage-700)", 46)}><L name="activity" size={23} /></div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 22, fontWeight: 800, fontVariantNumeric: "tabular-nums" }}>{totalMin} {t("u_min")}</div>
              <div style={{ fontSize: 13, color: "var(--text-muted)" }}>{day.workouts.length} {t("workouts_today_n")}</div>
            </div>
            <Badge tone="movement" dot>{t("logged_badge")}</Badge>
          </Card>
        ) : null}

        {form ? (
          <Card padding="md" style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <div style={{ fontWeight: 700, fontSize: 15 }}>{t("new_workout")}</div>
            <Input label={t("what_did_you_do")} placeholder={t("workout_ph")} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} autoFocus />
            <div style={{ display: "flex", gap: 10 }}>
              <Input label={t("dur_min")} type="number" placeholder="30" value={form.mins} onChange={(e) => setForm({ ...form, mins: e.target.value })} style={{ flex: 1 }} />
              <Input label={t("energy_kcal")} type="number" placeholder="—" value={form.kcal} onChange={(e) => setForm({ ...form, kcal: e.target.value })} style={{ flex: 1 }} optional={t("optional")} />
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <Button variant="ghost" onClick={() => setForm(null)}>{t("cancel")}</Button>
              <Button block onClick={save} disabled={!form.name.trim()}>{t("save")}</Button>
            </div>
          </Card>
        ) : null}

        {/* omat kirjaukset */}
        {day.workouts.length === 0 && !form ? (
          <EmptyState icon="dumbbell" title={t("no_entries")} body={t("log_workout_body")}
            action={<Button iconLeft={<L name="plus" size={17} />} onClick={() => setForm({ name: "", mins: "", kcal: "" })}>{t("log_workout")}</Button>} />
        ) : null}
        {day.workouts.length > 0 ? <SectionLabel>{t("my_workouts")}</SectionLabel> : null}
        {day.workouts.map((w) => (
          <Card key={w.id} flat style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 14px" }}>
            <div style={chip("var(--sage-100)", "var(--sage-700)", 40)}><L name="activity" size={20} /></div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 700, fontSize: 15 }}>{w.name}</div>
              <div style={{ fontSize: 13, color: "var(--text-muted)" }}>{w.mins} {t("u_min")}{w.kcal ? ` · ${w.kcal} kcal` : ""}</div>
            </div>
            <button onClick={() => store.removeWorkout(key, w.id)} style={iconBtn}><L name="trash-2" size={18} /></button>
          </Card>
        ))}

        <PlanDay plan={planForDate(store, refDate)} t={t} lang={lang} />
      </div>
    </div>
  );
}

function ViikkoOhjelma({ store, refDate, setRefDate, onOpenDay, t, lang, onMenu }) {
  const { Card } = window.VS;
  const { L, PageHeader } = window;
  const days = window.weekDays(refDate);
  const wk = window.isoWeek(refDate);
  const todayKey = window.dateKey();
  const program = store.state.programs && Array.isArray(store.state.programs.workouts) ? store.state.programs.workouts : null;
  const planFor = (d) => {
    const dow = (d.getDay() + 6) % 7;
    const src = program && program.length && program[0] && program[0].kind ? program : window.DEFAULT_PLAN;
    const e = src.find((x) => x.dow === dow);
    if (!e) return null;
    const nm = typeof e.name === "object" ? (e.name[lang] || e.name.fi) : e.name;
    return { name: nm, mins: e.mins, rest: !e.icon || e.mins === 0 };
  };
  const shift = (n) => { const d = new Date(refDate); d.setDate(d.getDate() + n * 7); setRefDate(d); };
  const monthRange = `${days[0].getDate()}.–${days[6].getDate()}.${days[6].getMonth() + 1}. ${days[6].getFullYear()}`;
  const totalMin = days.reduce((a, d) => a + store.day(window.dateKey(d)).workouts.reduce((x, w) => x + (Number(w.mins) || 0), 0), 0);
  const activeDays = days.filter((d) => store.day(window.dateKey(d)).workouts.length > 0).length;

  return (
    <div>
      <PageHeader title={t("week_plan_t")} onMenu={onMenu} />
      <div style={{ padding: "0 20px", display: "flex", flexDirection: "column", gap: 14 }}>
        <Card flat style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 14px" }}>
          <button onClick={() => shift(-1)} style={navBtn}><L name="chevron-left" size={20} color="var(--ink-600)" /></button>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 16, fontWeight: 800 }}>{t("week_w")} {wk}</div>
            <div style={{ fontSize: 12.5, color: "var(--text-muted)", fontWeight: 600 }}>{monthRange}</div>
          </div>
          <button onClick={() => shift(1)} style={navBtn}><L name="chevron-right" size={20} color="var(--ink-600)" /></button>
        </Card>

        <div style={{ display: "flex", gap: 10 }}>
          <Card padding="md" style={{ flex: 1, textAlign: "center" }}>
            <div style={{ fontSize: 22, fontWeight: 800 }}>{activeDays}</div>
            <div style={{ fontSize: 12, color: "var(--text-muted)", fontWeight: 600 }}>{t("active_days")}</div>
          </Card>
          <Card padding="md" style={{ flex: 1, textAlign: "center" }}>
            <div style={{ fontSize: 22, fontWeight: 800, fontVariantNumeric: "tabular-nums" }}>{totalMin}</div>
            <div style={{ fontSize: 12, color: "var(--text-muted)", fontWeight: 600 }}>{t("min_total")}</div>
          </Card>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {days.map((d, i) => {
            const dk = window.dateKey(d);
            const dd = store.day(dk);
            const isToday = dk === todayKey;
            const has = dd.workouts.length > 0;
            const mins = dd.workouts.reduce((a, w) => a + (Number(w.mins) || 0), 0);
            const pl = planFor(d);
            return (
              <Card key={i} flat interactive onClick={() => onOpenDay(d)} style={{
                display: "flex", alignItems: "center", gap: 14, padding: "12px 14px",
                border: isToday ? "1.5px solid var(--brand-300)" : "1px solid var(--border-subtle)",
                background: isToday ? "var(--brand-50)" : "var(--surface-card)",
              }}>
                <div style={{ width: 44, flexShrink: 0, textAlign: "center" }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: isToday ? "var(--brand-700)" : "var(--text-secondary)" }}>{window.DOW_SHORT[lang][i]}</div>
                  <div style={{ fontSize: 12, color: "var(--text-muted)", fontVariantNumeric: "tabular-nums" }}>{window.shortDate(d, lang)}</div>
                </div>
                <div style={{ width: 1, alignSelf: "stretch", background: "var(--border-subtle)" }}></div>
                <div style={chip(has ? "var(--sage-100)" : (pl && !pl.rest ? "var(--brand-50)" : "var(--ink-100)"), has ? "var(--sage-700)" : (pl && !pl.rest ? "var(--brand-600)" : "var(--ink-400)"), 38)}><L name={has ? "activity" : (pl && !pl.rest ? "calendar-check" : "circle-dashed")} size={19} /></div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  {has ? (
                    <React.Fragment>
                      <div style={{ fontWeight: 700, fontSize: 15, color: "var(--text-primary)" }}>{dd.workouts.length} {t("workouts_count")}</div>
                      <div style={{ fontSize: 12.5, color: "var(--text-muted)" }}>{mins} {t("u_min")}{pl && !pl.rest ? " \u00b7 " + pl.name : ""}</div>
                    </React.Fragment>
                  ) : pl ? (
                    <React.Fragment>
                      <div style={{ fontWeight: 700, fontSize: 14.5, color: pl.rest ? "var(--text-muted)" : "var(--text-primary)" }}>{pl.name}</div>

function planForDate(store, d) {
  const dow = (d.getDay() + 6) % 7;

  const src = prog && prog.length && prog[0] && prog[0].kind ? prog : window.DEFAULT_PLAN;
  return src.find((x) => x.dow === dow) || null;
}

function PlanDay({ plan, t, lang }) {
